name: ⭐ 功能建議 (Feature request)
description: 提出新功能或改進的建議 / Suggest a feature or an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Bookmania 不會加入移除或繞過 DRM 的功能。
        Bookmania will not add any way to remove or bypass DRM.

  - type: textarea
    id: feature
    attributes:
      label: 想要的功能 (What you would like)
      description: 請具體描述要做什麼、在哪個畫面。 / Describe what it should do and where.
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: 為什麼需要 (Why)
      description: 目前遇到的不便，或使用的情境。 / The problem it solves or how you would use it.

  - type: textarea
    id: other
    attributes:
      label: 其他 (Anything else)
      description: 截圖、範例或參考資料。 / Screenshots, examples or references.
