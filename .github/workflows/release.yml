# Builds the debug APKs when a version tag (v1.2.3) is pushed and publishes them on GitHub Releases.
# The debug build is signed with the debug key kept in the repository (app/debug.keystore), so every published APK
# updates the previous one in place; no secrets are needed. See docs/RELEASING.md.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # the debug version name counts the commits

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Set up the Android SDK build tools
        run: ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "build-tools;35.0.0"

      - name: Check that the tag matches the app's version
        run: |
          version=$(sed -n 's/^val _versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match the version $version in app/build.gradle.kts"
            exit 1
          fi

      - name: Test and build the debug APKs
        run: |
          mkdir -p ~/.gradle
          cp .github/runner-files/ci-gradle.properties ~/.gradle/gradle.properties
          ./gradlew :app:testBookmaniaDebugUnitTest :core:ebook:testDebugUnitTest :domain:testDebugUnitTest \
            :app:assembleBookmaniaDebug

      - name: Check the signatures and collect the APKs
        run: |
          apksigner="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/ | sort -V | tail -1)apksigner"
          # The certificate of the repository's debug key: every APK must carry it.
          expected=$(keytool -exportcert -keystore app/debug.keystore -storepass android -alias androiddebugkey \
            | sha256sum | cut -d' ' -f1)
          mkdir dist
          for abi in arm64-v8a armeabi-v7a x86 x86_64 universal; do
            apk="app/build/outputs/apk/bookmania/debug/app-bookmania-$abi-debug.apk"
            "$apksigner" verify "$apk"
            actual=$("$apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            if [ "$actual" != "$expected" ]; then
              echo "::error::$apk is not signed with app/debug.keystore ($actual)"
              exit 1
            fi
            cp "$apk" "dist/bookmania-$GITHUB_REF_NAME-debug-$abi.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Write the release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "### 下載 (Download)"
            echo
            echo "這是 debug 版：App 名稱「Bookmania Debug」，套件名稱 \`io.github.n09527.bookmania.debug\`。"
            echo "一般手機請下載 \`bookmania-$GITHUB_REF_NAME-debug-arm64-v8a.apk\`；裝不了時改用 \`universal\`。需要 Android 8.0 以上。"
            echo
            echo "This is the debug build (\"Bookmania Debug\", package \`io.github.n09527.bookmania.debug\`)."
            echo "Most phones need \`bookmania-$GITHUB_REF_NAME-debug-arm64-v8a.apk\`; if it does not install, use \`universal\`. Requires Android 8.0+."
            echo
            echo "### SHA-256"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Bookmania $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
