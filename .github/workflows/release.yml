# Publishes Bookmania on GitHub Releases when the version in app/build.gradle.kts changes on main, or when the
# workflow is run by hand (Actions > Release > Run workflow): the Android debug APKs and the unsigned iOS IPA, in one
# release. The workflow creates the tag v<version> itself, so no tag has to be pushed. A version that is already
# published is skipped, and nothing is published unless both platforms build.
# The debug APKs are signed with the debug key kept in the repository (app/debug.keystore), so every published APK
# updates the previous one in place; no secrets are needed. The IPA is not signed: it is signed with your own Apple ID
# when it is installed (docs/ios/INSTALL.md). See docs/RELEASING.md.
name: Release

on:
  push:
    branches:
      - main
    paths:
      - app/build.gradle.kts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check the version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # the earlier tags, to compare the version code

      - name: Read the version and decide whether to publish
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are made from main only (this run is on $GITHUB_REF)"
            exit 1
          fi
          version=$(sed -n 's/^val _versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          code=$(sed -n 's/^ *versionCode = \([0-9]*\)$/\1/p' app/build.gradle.kts)
          if [ -z "$version" ] || [ -z "$code" ]; then
            echo "::error::_versionName or versionCode not found in app/build.gradle.kts"
            exit 1
          fi
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::notice::$tag is already published. To publish a new version, change _versionName and versionCode."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null \
            && [ "$(git rev-parse "$tag^{commit}")" != "$GITHUB_SHA" ]; then
            echo "::error::The tag $tag already exists on another commit. Change the version, or delete the tag."
            exit 1
          fi
          # A phone only installs an update whose versionCode is larger than the installed one.
          previous=$(git tag -l 'v*' --sort=-version:refname | awk -v t="$tag" '$0 != t && !found { print; found = 1 }')
          if [ -n "$previous" ]; then
            previous_code=$(git show "$previous:app/build.gradle.kts" | sed -n 's/^ *versionCode = \([0-9]*\)$/\1/p')
            if [ -n "$previous_code" ] && [ "$code" -le "$previous_code" ]; then
              echo "::error::versionCode $code is not larger than $previous_code of $previous"
              exit 1
            fi
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

  android:
    name: Android (debug APKs)
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.check.outputs.tag }}

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # the debug version name counts the commits

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Set up the Android SDK build tools
        run: |
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"

      - name: Test and build the debug APKs
        run: |
          mkdir -p ~/.gradle
          cp .github/runner-files/ci-gradle.properties ~/.gradle/gradle.properties
          ./gradlew :app:testBookmaniaDebugUnitTest :core:ebook:testDebugUnitTest :domain:testDebugUnitTest \
            :app:assembleBookmaniaDebug

      - name: Check the signatures and collect the APKs
        run: |
          apksigner="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" # installed above
          # The certificate of the repository's debug key: every APK must carry it.
          expected=$(keytool -exportcert -keystore app/debug.keystore -storepass android -alias androiddebugkey \
            | sha256sum | cut -d' ' -f1)
          mkdir dist
          for abi in arm64-v8a armeabi-v7a x86 x86_64 universal; do
            apk="app/build/outputs/apk/bookmania/debug/app-bookmania-$abi-debug.apk"
            "$apksigner" verify "$apk"
            actual=$("$apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            if [ "$actual" != "$expected" ]; then
              echo "::error::$apk is not signed with app/debug.keystore ($actual)"
              exit 1
            fi
            cp "$apk" "dist/bookmania-$TAG-debug-$abi.apk"
          done

      - name: Keep the APKs for the release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-android
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7

  ios-core:
    name: iOS core unit tests (Linux)
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Test BookmaniaCore
        run: |
          swift --version
          swift test --package-path ios/BookmaniaCore

  ios:
    name: iOS (unsigned IPA)
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: macos-26
    env:
      TAG: ${{ needs.check.outputs.tag }}

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen --version

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build
        run: .github/scripts/ios-build.sh

      - name: Report compile errors
        if: failure()
        run: .github/scripts/ios-errors.sh ios/xcodebuild.log 1

      - name: Check the app and package the IPA
        run: .github/scripts/ios-package.sh "bookmania-$TAG-ios-unsigned.ipa"

      - name: Keep the IPA for the release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-ios
          path: ios/dist/*.ipa
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: [check, android, ios-core, ios]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.check.outputs.tag }}

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Collect the APKs and the IPA
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Check the files and write the checksums
        run: |
          missing=""
          for f in arm64-v8a armeabi-v7a x86 x86_64 universal; do
            [ -f "dist/bookmania-$TAG-debug-$f.apk" ] || missing="$missing bookmania-$TAG-debug-$f.apk"
          done
          [ -f "dist/bookmania-$TAG-ios-unsigned.ipa" ] || missing="$missing bookmania-$TAG-ios-unsigned.ipa"
          if [ -n "$missing" ]; then
            echo "::error::missing:$missing"
            exit 1
          fi
          (cd dist && sha256sum -- *.apk *.ipa > SHA256SUMS.txt)
          ls -l dist

      - name: Write the release notes
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::warning::CHANGELOG.md has no section for $version"
          fi
          # Relative links of the changelog (./docs/...) do not work on the release page: point them at this commit.
          blob="https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA"
          sed -i "s#](\./#]($blob/#g" notes.md
          {
            echo
            echo "### 下載 (Download)"
            echo
            echo "#### Android"
            echo
            echo "這是 debug 版：App 名稱「Bookmania Debug」，套件名稱 \`io.github.n09527.bookmania.debug\`。"
            echo "一般手機請下載 \`bookmania-$TAG-debug-arm64-v8a.apk\`；裝不了時改用 \`universal\`。需要 Android 8.0 以上。"
            echo
            echo "This is the debug build (\"Bookmania Debug\", package \`io.github.n09527.bookmania.debug\`)."
            echo "Most phones need \`bookmania-$TAG-debug-arm64-v8a.apk\`; if it does not install, use \`universal\`. Requires Android 8.0+."
            echo
            echo "#### iPhone／iPad（測試版 / test build）"
            echo
            echo "\`bookmania-$TAG-ios-unsigned.ipa\` 需要 iOS／iPadOS 26 以上。它沒有簽章：請用電腦上的側載工具（例如 Sideloadly）以自己的 Apple ID 簽章後安裝，步驟見 [docs/ios/INSTALL.md]($blob/docs/ios/INSTALL.md)。用免費 Apple ID 簽章的 App 7 天後到期，到期後要重新簽章安裝。"
            echo
            echo "\`bookmania-$TAG-ios-unsigned.ipa\` requires iOS/iPadOS 26 or later. It is not signed: sign and install it with your own Apple ID using a sideloading tool on a computer, such as Sideloadly; see [docs/ios/INSTALL.md]($blob/docs/ios/INSTALL.md) (Chinese). Apps signed with a free Apple ID expire after 7 days and have to be signed and installed again."
            echo
            echo "### SHA-256"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Creates the tag on this commit (or uses it if it is already there).
        run: gh release create "$TAG" dist/* --title "Bookmania $TAG" --notes-file notes.md --target "$GITHUB_SHA"
