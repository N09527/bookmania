# Builds the embedded Java VM of the iOS version's extension sources (docs/extensions-and-sync/design.md, stage E-1):
# Eclipse OpenJ9 + OMR and the OpenJDK 21 class library, interpreter only, as packaged by the Oneechan runtime
# (ios/Vendor/oneechan-runtime, MPL-2.0; its jvm-ios/README.md describes the build). The package (the static VM, the
# jlinked java.home, the extension host jar, the licence files) is cached by the runtime's commit, the Xcode version
# and these scripts, so it is built again only when one of them changes.
# How each step went is written as annotations (.github/scripts/ios-jvm-step.sh): the job log cannot be read from
# where this project is developed.
name: iOS JVM

on:
  push:
    paths:
      - 'ios/Vendor/oneechan-runtime'
      - '.github/workflows/ios-jvm.yml'
      - '.github/scripts/ios-jvm-*.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-jvm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    name: Embedded JVM (OpenJ9 for iOS)
    runs-on: macos-26
    timeout-minutes: 345
    env:
      RUNTIME: ios/Vendor/oneechan-runtime
      JOBS: '4'

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Report the machine
        run: |
          xcodes=$(ls -d /Applications/Xcode*.app 2>/dev/null | xargs -n1 basename | tr '\n' ' ')
          selected=$(xcodebuild -version | tr '\n' ' ')
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          cpus=$(sysctl -n hw.ncpu)
          memory=$(( $(sysctl -n hw.memsize) / 1073741824 ))
          free=$(df -h "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')
          tools="cmake $(cmake --version 2>/dev/null | head -1 | awk '{print $3}'); autoconf $(autoconf --version 2>/dev/null | head -1 | awk '{print $NF}'); python3 $(python3 --version 2>&1 | awk '{print $2}')"
          echo "::notice title=Machine::Xcode installed: ${xcodes}; selected: ${selected}; iOS SDK ${sdk}; ${cpus} CPUs, ${memory} GB memory, ${free} free; ${tools}"

      - name: Cache key
        id: key
        run: |
          runtime=$(git -C "$RUNTIME" rev-parse HEAD)
          xcode=$(xcodebuild -version | head -1 | tr -d ' ')
          echo "key=ios-jvm-${runtime}-${xcode}-${{ hashFiles('.github/workflows/ios-jvm.yml', '.github/scripts/ios-jvm-*.sh') }}" >> "$GITHUB_OUTPUT"

      - name: Restore the package
        id: cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.RUNTIME }}/build/embedded
          key: ${{ steps.key.outputs.key }}

      - name: Set up JDK 21 (the extension host's Gradle build)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Build tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install autoconf cmake || true

      - name: Fetch the sources
        if: steps.cache.outputs.cache-hit != 'true'
        run: .github/scripts/ios-jvm-step.sh fetch ./fetch-openj9.sh

      - name: Build OpenJ9 for macOS (jlinks the iOS image)
        if: steps.cache.outputs.cache-hit != 'true'
        run: .github/scripts/ios-jvm-step.sh build-macos ./build-openj9-macos.sh

      - name: Build OpenJ9 for the iOS simulator
        if: steps.cache.outputs.cache-hit != 'true'
        run: .github/scripts/ios-jvm-step.sh build-iossim ./build-openj9-ios.sh iphonesimulator

      - name: Build OpenJ9 for iOS devices
        if: steps.cache.outputs.cache-hit != 'true'
        run: .github/scripts/ios-jvm-step.sh build-ios ./build-openj9-ios.sh iphoneos

      - name: Package
        if: steps.cache.outputs.cache-hit != 'true'
        run: .github/scripts/ios-jvm-step.sh package ./package.sh

      - name: Save the package
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.RUNTIME }}/build/embedded
          key: ${{ steps.key.outputs.key }}

      - name: Boot the VM in the simulator (no app)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          # The smoke test runs in a simulator named OpenJ9-iPhone17, on the newest iOS runtime installed.
          runtime=$(xcrun simctl list runtimes -j | python3 -I -c 'import json, sys
          r = [x for x in json.load(sys.stdin)["runtimes"] if x["platform"] == "iOS" and x["isAvailable"]]
          r.sort(key=lambda x: [int(n) for n in x["version"].split(".")])
          print(r[-1]["identifier"])')
          xcrun simctl create OpenJ9-iPhone17 "iPhone 17" "$runtime" || xcrun simctl create OpenJ9-iPhone17 "iPhone 16" "$runtime"
          .github/scripts/ios-jvm-step.sh smoke-vm ./smoke-openj9-ios.sh iphonesimulator vm "$GITHUB_WORKSPACE/$RUNTIME/build/embedded/jre"

      - name: Report the package
        run: |
          cd "$RUNTIME/build/embedded"
          sizes=$(du -sh * | tr '\t' ' ' | tr '\n' ';')
          echo "::notice title=Package::${sizes} total $(du -sh . | cut -f1)"
