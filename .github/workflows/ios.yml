# Builds the iOS version (ios/, docs/ios/design.md) on every push that touches it: the core package's unit tests on
# Linux, and the app on macOS as an unsigned IPA (sign it with your own Apple ID to install it, see docs/ios/).
# Compile errors are also written as annotations, so they can be read without the job log.
name: iOS

on:
  push:
    paths:
      - 'ios/**'
      - 'app/src/main/assets/ebook/**'
      - 'core/ebook/src/test/resources/fixtures/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core unit tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Test BookmaniaCore
        run: |
          set -o pipefail
          swift --version
          swift test --package-path ios/BookmaniaCore 2>&1 | tee core-test.log

      - name: Report failed tests
        if: failure()
        run: |
          grep -E '(error:|recorded an issue|✘)' core-test.log | sed 's/\x1b\[[0-9;]*m//g' | head -10 | while IFS= read -r line; do
            echo "::error title=Core test::${line}"
          done

  app:
    name: App (unsigned IPA)
    runs-on: macos-26
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen --version

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          version=$(sed -n 's/^val _versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          code=$(sed -n 's/^ *versionCode = \([0-9]*\)$/\1/p' app/build.gradle.kts)
          echo "Version $version ($code)"
          xcodebuild -project ios/Bookmania.xcodeproj -scheme Bookmania -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath ios/build \
            MARKETING_VERSION="$version" CURRENT_PROJECT_VERSION="$code" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > ios/xcodebuild.log 2>&1
          tail -5 ios/xcodebuild.log

      # GitHub keeps at most 10 error annotations per step, so the errors are reported in groups of 10.
      - name: Report compile errors 1-10
        if: failure()
        run: .github/scripts/ios-errors.sh ios/xcodebuild.log 1
      - name: Report compile errors 11-20
        if: failure()
        run: .github/scripts/ios-errors.sh ios/xcodebuild.log 11
      - name: Report compile errors 21-30
        if: failure()
        run: .github/scripts/ios-errors.sh ios/xcodebuild.log 21
      - name: Report compile errors 31-40
        if: failure()
        run: .github/scripts/ios-errors.sh ios/xcodebuild.log 31

      - name: Check the app bundle
        run: |
          app=ios/build/Build/Products/Release-iphoneos/Bookmania.app
          missing=""
          for f in Bookmania Info.plist ebook/reader.html ebook/reader.js LICENSE NOTICE-foliate-js.txt Assets.car \
                   zh-Hant.lproj/Localizable.strings en.lproj/Localizable.strings; do
            [ -e "$app/$f" ] || missing="$missing $f"
          done
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")
          minos=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$app/Info.plist")
          archs=$(lipo -archs "$app/Bookmania")
          echo "::notice title=App bundle::version ${version} (${build}), minimum iOS ${minos}, ${archs}; $(cd "$app" && find . -type f | wc -l | tr -d ' ') files"
          if [ -n "$missing" ]; then
            echo "::error title=App bundle::missing:${missing}"
            exit 1
          fi

      - name: Package the IPA
        run: |
          mkdir -p ios/dist/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/Bookmania.app ios/dist/Payload/
          (cd ios/dist && zip -qry Bookmania-unsigned.ipa Payload)
          size=$(stat -f %z ios/dist/Bookmania-unsigned.ipa)
          sum=$(shasum -a 256 ios/dist/Bookmania-unsigned.ipa | cut -d' ' -f1)
          echo "::notice title=IPA::Bookmania-unsigned.ipa ${size} bytes, SHA-256 ${sum}"

      - name: Upload the IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Bookmania-ios-unsigned
          path: ios/dist/Bookmania-unsigned.ipa
          if-no-files-found: error
