# XcodeGen project for the iOS version (docs/ios/design.md). The Xcode project is generated from this file
# (`xcodegen generate` in ios/); it is not kept in the repository.
name: Bookmania
options:
  bundleIdPrefix: io.github.n09527
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
packages:
  BookmaniaCore:
    path: BookmaniaCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    # The workflows pass the version of app/build.gradle.kts (.github/scripts/ios-build.sh); keep these defaults for
    # local builds the same.
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "203"
targets:
  Bookmania:
    type: application
    platform: iOS
    sources:
      - path: Bookmania
        excludes:
          - "Info.plist"
      # The Android reader shell (reader.html, reader.js), shared as is: copied into the app as the folder "ebook".
      - path: ../app/src/main/assets/ebook
        type: folder
        buildPhase: resources
      # Shown in More > Open source licenses.
      - path: ../LICENSE
        buildPhase: resources
      - path: BookmaniaCore/NOTICE-foliate-js.txt
        buildPhase: resources
    dependencies:
      - package: BookmaniaCore
    # The embedded Java VM, when the build has its package (Config/JVM.xcconfig).
    configFiles:
      Debug: Config/JVM.xcconfig
      Release: Config/JVM.xcconfig
    postBuildScripts:
      - name: Bundle the extension runtime
        basedOnDependencyAnalysis: false
        script: |
          # The embedded Java VM's java.home, the extension host and their licence files (E-1), when this build has
          # the runtime's package (.github/workflows/ios-jvm.yml); else nothing.
          src="${SRCROOT}/Vendor/oneechan-runtime/build/embedded"
          dst="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/ExtensionRuntime"
          rm -rf "$dst"
          if [ -f "$src/bookmania-jvm.xcconfig" ] && [ -d "$src/jre" ] && [ -f "$src/host/oneechan-host.jar" ]; then
            mkdir -p "$dst"
            cp -R "$src/jre" "$src/host" "$src/licenses" "$dst/"
          fi
    info:
      path: Bookmania/Info.plist
      properties:
        CFBundleDisplayName: Bookmania
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        # The Documents folder appears in the Files app (On My iPhone > Bookmania): books go in its "local" folder.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        # The WebDAV sync's server can be on the local network (InfoPlist.strings has the translations).
        NSLocalNetworkUsageDescription: Bookmania connects to the WebDAV server you set up for sync, which can be on your local network.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.n09527.bookmania
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: Bookmania/Extensions/Runtime/Bookmania-Bridging-Header.h
        # The script that bundles the extension runtime reads the runtime's package outside the target's files.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
schemes:
  Bookmania:
    build:
      targets:
        Bookmania: all
    run:
      config: Debug
    archive:
      config: Release
