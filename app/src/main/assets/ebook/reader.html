<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>reader</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: transparent; }
  #stage { position: absolute; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden; }
  /* Book frames are passive: all input is handled by the native layer. */
  #stage iframe { position: absolute; border: 0; background: transparent; pointer-events: none; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="reader.js"></script>
</body>
</html>
